<main class="contenido">
  <button type="button" class="btn-volver" (click)="volver()">&lt; Volver a la convocatoria</button>

  <article class="wizard">
      <h1>Formulario de Postulación</h1>
      <p class="wizard__paso">Paso 1 de 6 — Datos personales</p>

      <form #f="ngForm" (ngSubmit)="enviar(f)" novalidate>
        <fieldset class="wizard__seccion">
          <legend>Datos Personales</legend>

          <div class="campo">
            <label for="tipo_documento">Tipo de documento</label>
            <select id="tipo_documento" name="tipo_documento" [(ngModel)]="datos.tipo_documento">
              <option value="CI">CÉDULA DE IDENTIDAD</option>
              <option value="PASAPORTE">PASAPORTE</option>
              <option value="CARNET_EXTRANJERIA">CARNET DE EXTRANJERÍA</option>
            </select>
          </div>

          <div class="campo">
            <label for="ci">N° de Documento *</label>
            <input id="ci" name="ci" type="text" maxlength="20" required [(ngModel)]="datos.ci" />
          </div>

          <div class="campo">
            <label for="complemento">Complemento</label>
            <input id="complemento" name="complemento" type="text" maxlength="10" [(ngModel)]="datos.complemento" />
          </div>

          <div class="campo">
            <label for="nombres">Nombres *</label>
            <input id="nombres" name="nombres" type="text" maxlength="150" required [(ngModel)]="datos.nombres" />
          </div>

          <div class="campo">
            <label for="apellido_paterno">Apellido Paterno *</label>
            <input
              id="apellido_paterno"
              name="apellido_paterno"
              type="text"
              maxlength="100"
              required
              [(ngModel)]="datos.apellido_paterno"
            />
          </div>

          <div class="campo">
            <label for="apellido_materno">Apellido Materno</label>
            <input
              id="apellido_materno"
              name="apellido_materno"
              type="text"
              maxlength="100"
              [(ngModel)]="datos.apellido_materno"
            />
          </div>

          <div class="campo">
            <label for="fecha_nacimiento">Fecha de nacimiento *</label>
            <input
              id="fecha_nacimiento"
              name="fecha_nacimiento"
              type="date"
              required
              [(ngModel)]="datos.fecha_nacimiento"
            />
          </div>

          <div class="campo">
            <label for="expedido">Expedido *</label>
            <select id="expedido" name="expedido" required [(ngModel)]="datos.expedido">
              <option value="" disabled selected>Seleccionar</option>
              @for (d of expedidos; track d.valor) {
                <option [value]="d.valor">{{ d.etiqueta }}</option>
              }
            </select>
          </div>

          <div class="campo">
            <label for="estado_civil">Estado civil *</label>
            <select id="estado_civil" name="estado_civil" required [(ngModel)]="datos.estado_civil">
              <option value="" disabled selected>Seleccionar</option>
              @for (ec of estadosCiviles; track ec) {
                <option [value]="ec">{{ ec }}</option>
              }
            </select>
          </div>

          <div class="campo">
            <label for="genero">Género *</label>
            <select id="genero" name="genero" required [(ngModel)]="datos.genero">
              <option value="" disabled selected>Seleccionar</option>
              <option value="MASCULINO">MASCULINO</option>
              <option value="FEMENINO">FEMENINO</option>
            </select>
          </div>

          <div class="campo">
            <label for="lugar_nacimiento">Lugar de nacimiento *</label>
            <input
              id="lugar_nacimiento"
              name="lugar_nacimiento"
              type="text"
              maxlength="150"
              required
              [(ngModel)]="datos.lugar_nacimiento"
            />
          </div>
        </fieldset>

        <fieldset class="wizard__seccion">
          <legend>Datos de Ubicación</legend>

          <div class="campo">
            <label for="departamento">Departamento *</label>
            <select id="departamento" name="departamento" required [(ngModel)]="datos.departamento">
              <option value="" disabled selected>Seleccionar</option>
              @for (d of departamentos; track d.valor) {
                <option [value]="d.valor">{{ d.etiqueta }}</option>
              }
            </select>
          </div>

          <div class="campo">
            <label for="localidad">Localidad *</label>
            <input id="localidad" name="localidad" type="text" maxlength="150" required [(ngModel)]="datos.localidad" />
          </div>

          <div class="campo campo--ancho">
            <label for="direccion_domicilio">Dirección domicilio *</label>
            <input
              id="direccion_domicilio"
              name="direccion_domicilio"
              type="text"
              maxlength="255"
              required
              [(ngModel)]="datos.direccion_domicilio"
            />
          </div>

          <div class="campo">
            <label for="telefono_domicilio">Teléfono</label>
            <input
              id="telefono_domicilio"
              name="telefono_domicilio"
              type="text"
              maxlength="15"
              [(ngModel)]="datos.telefono_domicilio"
            />
          </div>

          <div class="campo">
            <label for="celular">Celular *</label>
            <input id="celular" name="celular" type="text" maxlength="15" required [(ngModel)]="datos.celular" />
          </div>

          <div class="campo">
            <label for="email">Correo electrónico *</label>
            <input id="email" name="email" type="email" maxlength="150" required [(ngModel)]="datos.email" />
          </div>
        </fieldset>

        <fieldset class="wizard__seccion">
          <legend>Datos Adicionales</legend>

          <div class="campo">
            <label for="nro_libreta_militar">N° Libreta Militar</label>
            <input
              id="nro_libreta_militar"
              name="nro_libreta_militar"
              type="text"
              maxlength="30"
              [(ngModel)]="datos.nro_libreta_militar"
            />
          </div>

          <div class="campo">
            <label for="grupo_sanguineo">Grupo Sanguíneo</label>
            <input
              id="grupo_sanguineo"
              name="grupo_sanguineo"
              type="text"
              maxlength="5"
              [(ngModel)]="datos.grupo_sanguineo"
            />
          </div>

          <div class="campo campo--ancho">
            <label for="contacto_emergencia">Contacto de emergencia *</label>
            <input
              id="contacto_emergencia"
              name="contacto_emergencia"
              type="text"
              maxlength="150"
              required
              [(ngModel)]="datos.contacto_emergencia"
            />
          </div>
        </fieldset>

        @if (error()) {
          <p class="mensaje-error">{{ error() }}</p>
          @if (postulacionExistenteId()) {
            <button type="button" class="btn-secundario" (click)="continuarPostulacionExistente()">
              Continuar esa postulación
            </button>
          }
        }

        <div class="wizard__acciones">
          <button type="submit" class="btn-primario" [disabled]="enviando()">
            {{ enviando() ? 'Guardando...' : 'Guardar y siguiente' }}
          </button>
        </div>
      </form>
    </article>
</main>
