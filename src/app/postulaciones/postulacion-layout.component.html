<div class="layout">
  <nav class="menu-lateral" aria-label="Menú del postulante">
    <div class="menu-lateral__marca">Gestora</div>
    <ul>
      <li><a routerLink="/" routerLinkActive="activo" [routerLinkActiveOptions]="{ exact: true }">Inicio</a></li>
      <li><a routerLink="/">Nuevo registro</a></li>
      <li>
        <a routerLink="/postulaciones/mis-postulaciones" routerLinkActive="activo">Mis postulaciones</a>
      </li>
      <li><a routerLink="/">Convocatorias vigentes</a></li>
      <li>
        <a routerLink="/postulaciones/notificaciones" routerLinkActive="activo" class="menu-lateral__con-contador">
          Notificaciones
          @if (notificaciones.noLeidas() > 0) {
            <span class="contador" [attr.aria-label]="notificaciones.noLeidas() + ' sin leer'">{{ notificaciones.noLeidas() }}</span>
          }
        </a>
      </li>
    </ul>
  </nav>

  <div class="layout__contenido">
    <router-outlet />
  </div>
</div>
